name: DV lottery watch

on:
  schedule:
    - cron: "17 * * * *"   # каждый час в :17
  workflow_dispatch:        # ручной запуск кнопкой

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка страниц
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_dv.py
      - name: Сохранить состояние
        run: |
          git config user.name "dv-watch-bot"
          git config user.email "dv-watch-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
